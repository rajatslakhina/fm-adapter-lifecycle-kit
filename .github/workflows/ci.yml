name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · Swift 6
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      # `-warnings-as-errors` is what makes "zero warnings" a machine-checked claim
      # rather than a sentence in a README.
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  apple:
    name: macOS · Swift 6
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      # The macOS job is not a duplicate of the Linux one: SwiftUI exists here, so this
      # is the run that actually compiles the AdapterLifecycleUI console.
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

      # `Package.swift` declares `.iOS(.v17)`, so something has to actually build for iOS
      # or that declaration is an unchecked claim. `generic/platform=iOS Simulator` needs
      # no simulator *runtime* to be installed on the runner, unlike a named device.
      - name: Build for iOS Simulator
        run: |
          xcodebuild -list
          xcodebuild build \
            -scheme AdapterLifecycleUI \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
